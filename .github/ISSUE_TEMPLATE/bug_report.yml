name: Bug report
description: Report a problem with HexaDesktop
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem! Please check the [FAQ](https://github.com/gethexa/HexaDesktop-Releases/blob/main/docs/faq.md) and [Troubleshooting](https://github.com/gethexa/HexaDesktop-Releases/blob/main/docs/troubleshooting.md) guides first.

        **Security vulnerabilities must not be reported here** — see our [security policy](https://github.com/gethexa/HexaDesktop-Releases/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: HexaDesktop version
      description: Find it in Help → About HexaDesktop.
      placeholder: e.g. 1.2.3
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version / distribution
      placeholder: e.g. macOS 15.1, Ubuntu 24.04
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Attach log files or screenshots. Please remove any personal information first.
